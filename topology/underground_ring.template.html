<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>/* PAGE_TITLE */</title>
<!-- /* PAGE_NOTE */ -->
<style>
html,body{margin:0;background:#e6e4de;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
#poster{display:block;margin:20px auto 90px;width:min(96vw,1650px);height:auto;background:#fcfbf8;box-shadow:0 2px 26px rgba(0,0,0,.09)}
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:#16171a;color:#f3f3f0;border-radius:999px;padding:7px 16px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:10;white-space:nowrap}
.bar a{color:#f3f3f0;font-weight:700;text-decoration:none}
.bar a:hover{text-decoration:underline}
.bar label{display:flex;gap:5px;align-items:center;cursor:pointer;color:#d6d7da}
.bar .state{color:#9fa2a8;font-size:11.5px}
.bar button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:4px 14px;background:#2f6fd6;color:#fff;cursor:pointer}
.bar button:disabled{background:#4a4c52;color:#9fa2a8;cursor:default}
.panel{position:fixed;top:16px;right:16px;width:270px;max-height:calc(100vh - 100px);overflow:auto;background:#16171a;color:#e8e8e4;border-radius:12px;padding:12px 14px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:10}
.panel h3{margin:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fa2a8}
.panel h3:first-child{margin-top:0}
.panel button{font:inherit;border:0;border-radius:5px;padding:2px 7px;background:#33353b;color:#e8e8e4;cursor:pointer}
.panel button:hover{background:#474a52}
.panel .row{display:flex;align-items:center;gap:6px;margin:3px 0}
.panel .sw{width:18px;height:6px;border-radius:2px;flex:none}
.panel .grow{flex:1}
.panel .keys{color:#9fa2a8;line-height:1.55}
.panel kbd{font:inherit;background:#33353b;border-radius:3px;padding:0 4px;color:#e8e8e4}
body.editing #poster{cursor:default;user-select:none;width:min(calc(100vw - 340px),1650px);margin-left:20px}
body.editing [data-station]{cursor:grab}
body.editing [data-label],body.editing [data-seg]{cursor:pointer}
</style>
</head>
<body>
<svg id="poster" xmlns="http://www.w3.org/2000/svg"></svg>
<script id="svgExportBuffer" type="application/xml"></script>
<div class="bar">
  <a href="/* OTHER_HREF */">/* OTHER_LABEL */</a>
  <label><input type="checkbox" id="others"> other parents</label>
  <label><input type="checkbox" id="edit"> edit</label>
  <button id="save" hidden disabled title="Run node tools/ring_editor.mjs to save">Save</button>
  <span class="state" id="state"></span>
</div>
<div class="panel" id="panel" hidden></div>
<script>
const DATA=/* PROTOTYPE_DATA */;
const VARIANT='/* VARIANT_KEY */';
const byId=Object.fromEntries(DATA.people.map(p=>[p.id,p]));
const LINES=DATA.lines,lineById=Object.fromEntries(LINES.map(l=>[l.id,l]));
const FONT='Inter, "Helvetica Neue", Arial, sans-serif';
const LW=8,CASING=2,GAP=11,LANE=14,CORNER=20,TICK=5.5,ZONE_R=CORNER-GAP/2;
// Extra half-height of every ring, which turns the square rings into a portrait map.
const STRETCH=170;

const V=(x,y)=>({x,y}),add=(a,b)=>V(a.x+b.x,a.y+b.y),sub=(a,b)=>V(a.x-b.x,a.y-b.y),mul=(a,k)=>V(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y),norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l)},dot=(a,b)=>a.x*b.x+a.y*b.y,cross=(a,b)=>a.x*b.y-a.y*b.x;
const leftN=d=>V(d.y,-d.x),dist=(a,b)=>len(sub(a,b));

// ---------- network: stations, track segments, tree of first appearance ----------
const segMap=new Map(),stations=[],treeParent={},kids={};
// Aether, Hemera and Charon stay on the Erebus branch. Night merges into them afterwards.
const erebusChildren=new Set(['aether','hemera','charon']);
function addSeg(a,id,lineId){
  const key=a+'>'+id;if(!segMap.has(key))segMap.set(key,{key,a,b:id,lines:[]});
  const s=segMap.get(key);if(!s.lines.includes(lineId))s.lines.push(lineId);
}
for(const L of LINES)for(const path of L.paths)path.forEach((id,i)=>{
  if(!stations.includes(id)){
    if(L.id==='night'&&erebusChildren.has(id))return;
    stations.push(id);kids[id]=[];if(i>0){treeParent[id]=path[i-1];kids[path[i-1]].push(id)}
  }
  if(i>0&&stations.includes(id))addSeg(path[i-1],id,L.id);
});
for(const id of erebusChildren)addSeg('nyx',id,'night');
const segs=[...segMap.values()];
const outOf=id=>segs.filter(s=>s.a===id),inTo=id=>segs.filter(s=>s.b===id);
const linesAt=Object.fromEntries(stations.map(id=>[id,new Set()]));
for(const s of segs)for(const l of s.lines){linesAt[s.a].add(l);linesAt[s.b].add(l)}
const otherParentLinks=DATA.links.filter(([a,b])=>stations.includes(a)&&stations.includes(b)&&!segMap.has(a+'>'+b));

// ---------- geometry helpers ----------
function clean(pts){
  const out=[];for(const p of pts){if(out.length&&dist(out.at(-1),p)<.5)continue;out.push(p)}
  for(let i=out.length-2;i>0;i--){const u=sub(out[i],out[i-1]),w=sub(out[i+1],out[i]);if(Math.abs(cross(u,w))<1e-6*len(u)*len(w)+1e-9&&dot(u,w)>0)out.splice(i,1)}
  return out;
}
function segX(p1,p2,p3,p4){const d1=sub(p2,p1),d2=sub(p4,p3),den=cross(d1,d2);if(Math.abs(den)<1e-9)return false;const t=cross(sub(p3,p1),d2)/den,u=cross(sub(p3,p1),d1)/den;return t>1e-6&&t<1-1e-6&&u>1e-6&&u<1-1e-6}
function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}return {x0,y0,x1,y1}}
function polyCross(a,b){
  const A=a.bb??=bbox(a),B=b.bb??=bbox(b);if(A.x1<B.x0||B.x1<A.x0||A.y1<B.y0||B.y1<A.y0)return 0;
  let n=0;for(let i=1;i<a.length;i++)for(let j=1;j<b.length;j++)if(segX(a[i-1],a[i],b[j-1],b[j]))n++;return n;
}
function pointSegDist(p,a,b){const d=sub(b,a),t=Math.max(0,Math.min(1,dot(sub(p,a),d)/(dot(d,d)||1)));return dist(p,add(a,mul(d,t)))}
// Layout score used by both searches: crossings and track running through other stations dominate, then total track length.
function layoutCost(lay){
  const polys=segs.map(s=>lay.route(s,lay.pos[s.a],lay.pos[s.b]));let cr=0,L=0,through=0;
  for(let i=0;i<polys.length;i++){
    for(let k=1;k<polys[i].length;k++)L+=dist(polys[i][k-1],polys[i][k]);
    for(let j=i+1;j<polys.length;j++)cr+=polyCross(polys[i],polys[j]);
    for(const v of stations){if(v===segs[i].a||v===segs[i].b)continue;for(let k=1;k<polys[i].length;k++)if(pointSegDist(lay.pos[v],polys[i][k-1],polys[i][k])<16){through++;break}}
  }
  const apart=coupleDistance(lay.pos),bend=spineBend(lay.pos);
  return {cr,through,L,apart,bend,cost:cr*1000+through*700+L+apart+bend*40};
}
// The Sovereignty line from Chaos to Zeus is the poster's spine: it runs level along the east side.
const spine=LINES[0].paths[0].slice(1,LINES[0].paths[0].indexOf('zeus')+1);
const spineBend=pos=>spine.reduce((s,id)=>s+Math.abs(pos[id].y),0);
// Weighted distance between partners, so couples with shared children sit near each other.
const coupleDistance=pos=>DATA.couples.reduce((s,c)=>s+c.weight*dist(pos[c.a],pos[c.b]),0);
function offsetPoly(pts,off){
  if(!off)return pts.slice();
  return pts.map((p,i)=>{
    const dp=i>0?norm(sub(p,pts[i-1])):null,dn=i<pts.length-1?norm(sub(pts[i+1],p)):null;
    if(!dp)return add(p,mul(leftN(dn),off));if(!dn)return add(p,mul(leftN(dp),off));
    const n1=leftN(dp),m=norm(add(n1,leftN(dn)));return add(p,mul(m,off/Math.max(.3,dot(m,n1))));
  });
}
const f=p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`;
// Corners are smooth arcs. ts optionally gives each corner's tangent lengths {a,b}: how far back along the incoming
// and outgoing legs it starts and ends. Equal lengths make a circular arc; unequal ones stretch it.
function roundedD(pts,r,ts){
  let d=`M${f(pts[0])}`;
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1],ua=norm(sub(a,b)),uc=norm(sub(c,b)),rr=Math.min(r,dist(a,b)/2,dist(b,c)/2),ta=ts?.[i]?.a??rr,tb=ts?.[i]?.b??rr;
    const phi=Math.PI-Math.acos(Math.max(-1,Math.min(1,dot(ua,uc)))),k=phi<1e-3?0:4/3*Math.tan(phi/4)/Math.tan(phi/2);
    const p1=add(b,mul(ua,ta)),p2=add(b,mul(uc,tb));
    d+=` L${f(p1)} C${f(add(p1,mul(ua,-ta*k)))} ${f(add(p2,mul(uc,-tb*k)))} ${f(p2)}`;
  }
  return d+` L${f(pts.at(-1))}`;
}
// Parallel tracks turning together nest: each curve is a circle whose radius grows by the track's distance from the
// innermost one, so every line keeps one radius and the gap holds round the bend. Where the two legs are spaced
// differently the wider spacing sets the radius, so neighbours never close up.
function cornerTangents(tracks,r){
  const cs=[];
  tracks.forEach((t,ti)=>{for(let i=1;i<t.pts.length-1;i++){
    const a=t.pts[i-1],b=t.pts[i],c=t.pts[i+1],din=norm(sub(b,a)),dout=norm(sub(c,b));if(dot(din,dout)>.999)continue;
    cs.push({ti,i,b,din,dout,o:dot(b,sub(dout,din)),max:Math.min(dist(a,b),dist(b,c))});
  }});
  const ts=tracks.map(()=>({}));
  for(const c of cs){
    // Its group: same-heading corners reached by steps of at most one lane, each nested inside or outside the last.
    const same=cs.filter(x=>dot(x.din,c.din)>.999&&dot(x.dout,c.dout)>.999),g=[c];
    const step=(x,y)=>{const D=sub(x.b,y.b),ea=dot(D,c.din),eb=-dot(D,c.dout);return Math.abs(ea)<=LANE+.5&&Math.abs(eb)<=LANE+.5&&ea*eb>=-.25&&Math.abs(ea)+Math.abs(eb)>.5};
    for(let k=0;k<g.length;k++)for(const x of same)if(!g.includes(x)&&step(x,g[k]))g.push(x);
    const inner=g.reduce((m,x)=>x.o>m.o?x:m,c);
    const t0=Math.min(r,inner.max/2);
    const D=sub(c.b,inner.b),ea=dot(D,c.din),eb=-dot(D,c.dout);
    ts[c.ti][c.i]=ea>-.5&&eb>-.5?{a:t0+Math.max(0,ea,eb),b:t0+Math.max(0,ea,eb)}:{a:Math.min(r,c.max/2),b:Math.min(r,c.max/2)};
  }
  // Two corners never claim more of the leg between them than it has.
  tracks.forEach((t,ti)=>{const T=ts[ti],n=t.pts.length;
    for(let i=0;i<n-1;i++){const a=T[i]?.b??0,b=T[i+1]?.a??0,L=dist(t.pts[i],t.pts[i+1]);if(a+b>L){const s=L/(a+b);if(T[i])T[i].b=a*s;if(T[i+1])T[i+1].a=b*s}}
  });
  return ts;
}
function rectHit(r,a,b){
  let t0=0,t1=1;const dx=b.x-a.x,dy=b.y-a.y;
  for(const [p,q] of [[-dx,a.x-r.x],[dx,r.x+r.w-a.x],[-dy,a.y-r.y],[dy,r.y+r.h-a.y]]){
    if(Math.abs(p)<1e-12){if(q<0)return false}else{const t=q/p;if(p<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}
  }
  return true;
}
const rectsOverlap=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
const inflate=(r,k)=>({x:r.x-k,y:r.y-k,w:r.w+2*k,h:r.h+2*k});
const measure=(()=>{const ctx=document.createElement('canvas').getContext('2d');return(text,size,weight)=>{ctx.font=`${weight} ${size}px ${FONT}`;return ctx.measureText(text).width}})();
function* permutations(xs){if(xs.length<=1){yield xs.slice();return}for(let i=0;i<xs.length;i++){const rest=[...xs.slice(0,i),...xs.slice(i+1)];for(const p of permutations(rest))yield [xs[i],...p]}}

// Symmetric octilinear route along the dominant axis.
function routeOcti(P,Q){
  const dx=Q.x-P.x,dy=Q.y-P.y,ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<.5||ay<.5||Math.abs(ax-ay)<.5)return [P,Q];
  if(ax>ay){const h=(ax-ay)/2*Math.sign(dx);return [P,V(P.x+h,P.y),V(Q.x-h,Q.y),Q]}
  const h=(ay-ax)/2*Math.sign(dy);return [P,V(P.x,P.y+h),V(Q.x,Q.y-h),Q];
}

// Replace any leg that isn't at 0°, 45° or 90° with an octilinear two-bend route between its ends.
function octilinear(pts){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const a=out.at(-1),b=pts[i],ax=Math.abs(b.x-a.x),ay=Math.abs(b.y-a.y);
    if(ax<.5||ay<.5||Math.abs(ax-ay)<.5)out.push(b);else out.push(...routeOcti(a,b).slice(1));
  }
  return clean(out);
}

// Hill-climb an ordering by moving one item to another position until nothing improves; exhaustive when short.
function improveOrder(items,evaluate,maxEvals=1e9){
  let tried=0,best=null;const run=o=>{if(tried>=maxEvals)return false;tried++;const r=evaluate(o);if(!best||r.c.cost<best.c.cost-1e-6){best={...r,order:o};return true}return false};
  if(items.length<=5){for(const p of permutations(items))run(p);return {best,tried}}
  run(items);
  for(let pass=0;pass<4;pass++){let improved=false;
    for(let i=0;i<items.length;i++)for(let j=0;j<items.length;j++){if(i===j)continue;const o=best.order.slice(),[x]=o.splice(i,1);o.splice(j,0,x);if(run(o))improved=true}
    if(!improved)break}
  return {best,tried};
}
// ---------- layout: zones as rings, lines travel along zone boundaries ----------
// Coordinate descent over each station's sibling order (the radial analogue of crossing-minimising layer ordering).
const roots=stations.filter(id=>id!=='chaos'&&!treeParent[id]);
const rootPartner=Object.fromEntries(roots.map(v=>[v,DATA.couples.map(c=>c.a===v?c.b:c.b===v?c.a:null).find(o=>o&&byId[o].depth===byId[v].depth)]));
// Start from the saved arrangement, so adding a figure nudges the map instead of redrawing it.
// A saved family keeps its order: the search only chooses where each new child joins it.
const SEED=DATA.seed;
const defaultOrder=v=>{const [m,...o]=kids[v];if(!m)return [];const h=Math.floor(o.length/2);return [...o.slice(0,h),m,...o.slice(h)]};
function searchRing(){
  const orders={roots:{}},fresh={};
  for(const v of stations){
    const saved=SEED?.orders?.[v];if(!saved||kids[v].length<2)continue;
    const kept=saved.filter(c=>kids[v].includes(c));orders[v]=kept;fresh[v]=kids[v].filter(c=>!kept.includes(c));
  }
  for(const v of roots)if(SEED?.roots?.[v]!==undefined)orders.roots[v]=SEED.roots[v];
  const cost=o=>{const lay=layoutRing(o);return {lay,c:layoutCost(lay)}};
  let tried=0;
  for(const v of Object.keys(fresh))for(const c of fresh[v]){
    let pick=null;
    for(let i=0;i<=orders[v].length;i++){const o=orders[v].slice();o.splice(i,0,c);const r=cost({...orders,[v]:o});tried++;if(!pick||r.c.cost<pick.c.cost)pick={o,...r}}
    orders[v]=pick.o;
  }
  let best=cost(orders);tried++;
  for(let round=0;round<2;round++){
    for(const v of stations){
      if(kids[v].length<2||SEED?.orders?.[v])continue;
      const r=improveOrder(orders[v]??kids[v],o=>cost({...orders,[v]:o}));
      tried+=r.tried;if(r.best.c.cost<best.c.cost-1e-6){best=r.best;orders[v]=r.best.order}
    }
    for(const v of roots)if(rootPartner[v]&&SEED?.roots?.[v]===undefined)for(const side of [-1,0,1]){
      if(side===(orders.roots[v]??0))continue;
      const o={...orders,roots:{...orders.roots,[v]:side}},r=cost(o);tried++;
      if(r.c.cost<best.c.cost-1e-6){best=r;orders.roots=o.roots}
    }
  }
  for(const v of stations)if(kids[v].length>=2)orders[v]??=defaultOrder(v);
  for(const v of roots)orders.roots[v]??=0;
  return Object.assign(best.lay,{search:`${tried} sibling orders`,score:best.c,orders});
}
// Ring s is a rectangle s wide and s+D tall either side of Chaos. Every ring shares the same D,
// so corners of successive rings stay on 45° diagonals. Stations sit on ring depth×R.
const R=165,D=STRETCH,perimeter=s=>8*s+4*D,hy=s=>s+D;
const sideKey=(p)=>{const ax=Math.abs(p.x),ay=Math.abs(p.y)-D;return Math.abs(ax-ay)<1&&ay>0?(p.y<0?'N':'S')+(p.x>0?'E':'W'):ax>ay?(p.x>0?'E':'W'):(p.y>0?'S':'N')};
const cornerPt=(k,s)=>V(k.includes('E')?s:-s,k.includes('S')?hy(s):-hy(s));
const fromSide=(k,c,s)=>k==='E'?V(s,c):k==='W'?V(-s,c):k==='N'?V(c,-hy(s)):V(c,hy(s));
const tang=(p,k)=>k==='E'||k==='W'?p.y:p.x;
const halfSide=(k,s)=>k==='E'||k==='W'?hy(s):s;
const cornerFrom=(k,c)=>k==='E'?(c<0?'NE':'SE'):k==='W'?(c<0?'NW':'SW'):k==='N'?(c<0?'NW':'NE'):(c<0?'SW':'SE');
// Stations sit mid-side or exactly on a corner, so every leg to a zone boundary is 0°, 45° or 90°.
function snap(p,s){
  if(!s)return V(0,0);const k=sideKey(p);if(k.length===2)return cornerPt(k,s);
  const c=tang(p,k),h=halfSide(k,s),maxC=h-R/2;if(Math.abs(c)<=maxC)return fromSide(k,c,s);
  return Math.abs(c)>h-R/4?cornerPt(cornerFrom(k,c),s):fromSide(k,Math.sign(c)*maxC,s);
}
// Distance along ring s, anticlockwise from the middle of its east side.
function tOf(p,s){
  const h=hy(s);let {x,y}=p;if(Math.abs(x)>=Math.abs(y)-D)x=Math.sign(x||1)*s;else y=Math.sign(y)*h;
  if(x>=s-1e-6&&y<=0)return -y;if(y<=-h+1e-6)return h+(s-x);if(x<=-s+1e-6)return h+2*s+(y+h);if(y>=h-1e-6)return 3*h+2*s+(x+s);return 3*h+4*s+(h-y);
}
function pOf(t,s){
  const h=hy(s),T=perimeter(s);t=((t%T)+T)%T;
  if(t<=h)return V(s,-t);if(t<=h+2*s)return V(s-(t-h),-h);if(t<=3*h+2*s)return V(-s,-h+(t-h-2*s));if(t<=3*h+4*s)return V(-s+(t-3*h-2*s),h);return V(s,h-(t-3*h-4*s));
}
// The nearest valid station point on ring s.
const onRing=(p,s)=>s?snap(pOf(tOf(p,s),s),s):V(0,0);

function layoutRing(orders={}){
  const w={};
  const weight=v=>w[v]=kids[v].length?kids[v].reduce((s,c)=>s+weight(c),0):1;weight('chaos');
  const ordered=v=>orders[v]??defaultOrder(v);
  const ang={};
  function place(v,lo,hi,th){ang[v]=th;let t=lo;for(const c of ordered(v)){const span=(hi-lo)*w[c]/w[v];let tc=t+span/2;if(c===kids[v][0]&&th>=t-1e-9&&th<=t+span+1e-9)tc=th;place(c,t,t+span,tc);t+=span}}
  const main=kids.chaos[0];let before=0;for(const c of ordered('chaos')){if(c===main)break;before+=w[c]}
  const frac=(before+w[main]/2)/w.chaos;place('chaos',-2*Math.PI*frac,2*Math.PI*(1-frac),0);
  // The priority couple sits side by side on its ring; the moved partner brings its own descendants along.
  // Children the couple share (Erebus and Nyx's) stay put instead, grouped beside the other partner's own children.
  const turn=(v,d)=>{ang[v]+=d;for(const c of kids[v])turn(c,d)};
  const besideStep=v=>1.3*62*2*Math.PI/perimeter(byId[v].depth*R);
  const parentOf=(p,c)=>DATA.links.some(([a,b])=>a===p&&b===c);
  for(const c of DATA.couples.filter(c=>c.weight>=3&&byId[c.a].depth===byId[c.b].depth&&!roots.includes(c.a)&&!roots.includes(c.b))){
    let gap=ang[c.b]-ang[c.a];gap=Math.atan2(Math.sin(gap),Math.cos(gap));
    const d=Math.sign(gap||1)*besideStep(c.a)-gap;
    if(kids[c.b].length&&kids[c.b].every(k=>parentOf(c.a,k)))ang[c.b]+=d;else turn(c.b,d);

// ---------- editor ----------
// Drag stations along their ring, pick label sides, shift lanes and reorder tracks.
// Save needs the local server (node tools/ring_editor.mjs), which writes topology/ring_positions.json.
const GRID=11,ALIGN=8,LABEL_SIDES=['N','NE','E','SE','S','SW','W','NW','EL'];
const snapshot=()=>JSON.stringify(savedEdits());
function savedEdits(){
  const positions={};for(const v of stations){const p=EDITS.positions[v];if(p)positions[v]={x:Math.round(p.x*10)/10,y:Math.round(p.y*10)/10}}
  const lanes=Object.fromEntries(Object.entries(EDITS.lanes).filter(([,n])=>n));
  return {positions,labels:EDITS.labels,lanes,trackOrder:EDITS.trackOrder,stationOrder:EDITS.stationOrder};
}
function restore(json){const e=JSON.parse(json);Object.assign(EDITS,{positions:e.positions,labels:e.labels,lanes:e.lanes,trackOrder:e.trackOrder,stationOrder:e.stationOrder??{}});rerender()}

function undo(){if(!EDITOR.undo.length)return;EDITOR.redo.push(snapshot());restore(EDITOR.undo.pop())}
function redo(){if(!EDITOR.redo.length)return;EDITOR.undo.push(snapshot());restore(EDITOR.redo.pop())}

let frame=0;

// Every station gets an explicit position, so moving one never sets off the layout search.
function freezePositions(){const lay=layoutCache??currentLayout();for(const v of stations)EDITS.positions[v]??={x:lay.pos[v].x,y:lay.pos[v].y}}

// The point on v's ring nearest p: on the grid, or level with another station within ALIGN.
function placeOnRing(v,p,free){
  const s=byId[v].depth*R,q=onRing(p,s),k=sideKey(q);EDITOR.guide=null;

  if(near&&tang(r,k)===near.c)EDITOR.guide={axis,c:near.c};

const maxDepth=Math.max(...stations.map(id=>byId[id].depth));

document.getElementById('panel').addEventListener('click',e=>{

addEventListener('keydown',e=>{
  if(!EDITOR.on||e.target.closest?.('input,textarea'))return;
  const k=e.key,ctrl=e.ctrlKey||e.metaKey,v=EDITOR.sel;

  if(!v)return;

  if(step){e.preventDefault();remember();const n=e.shiftKey?1:GRID,p=EDITS.positions[v],s=byId[v].depth*R;

const othersBox=document.getElementById('others');othersBox.checked=params.get('others')==='1';
const editBox=document.getElementById('edit');editBox.checked=params.get('edit')==='1';
function show(){
  const p=new URLSearchParams(location.search);
  for(const [box,key] of [[othersBox,'others'],[editBox,'edit']])if(box.checked)p.set(key,'1');else p.delete(key);
  const q=p.toString();history.replaceState(null,'',q?`?${q}`:location.pathname);
  layoutCache=null;setEditing(editBox.checked);render(VARIANT,othersBox.checked);
}
othersBox.onchange=editBox.onchange=show;
show();
</script>
</body>
</html>
